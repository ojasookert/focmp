[package]
name = "focmp-installer"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.4.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
