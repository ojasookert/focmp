; FOCMP configuration. Changes take effect after restarting the game.
[network]
; Steam lobbies and Steam display names: steam
; Direct connections / multiple local instances: tcp
transport = steam

[gameplay]
; Host settings apply to everyone. Only used with two or more players.
; Health = native health * multiplier * (1 + per_extra_player * (players - 1)).
enemy_health_multiplier = 1.0
enemy_health_per_extra_player = 0.5
; Damage uses the same formula. Single player is unchanged.
; 2 players: 1.5x health / 1.1x damage; 3 players: 2x health / 1.2x damage.
enemy_damage_multiplier = 1.0
enemy_damage_per_extra_player = 0.1

[debug]
; Development console on 127.0.0.1:47811. Leave off: any program on this PC could control the game through it.
console = false
